[workspace]
resolver = "2"
members = [
    ".",
    "plugins/tcp_engine",
    "plugins/generator_plugin",
    "plugins/filter_engine",
    "plugins/generator_engine",
    "plugins/inspector_engine",
]
default-members = [
    ".",
    "plugins/tcp_engine",
    "plugins/generator_plugin",
    "plugins/filter_engine",
    "plugins/generator_engine",
    "plugins/inspector_engine",
]

[workspace.package]
version = "0.6.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
wabrix_api = { git = "https://github.com/ninegamma/wabrix_api.git", branch = "main", version= "0.6.1" }
wabrix_plugins = { path = "." }
wit-bindgen = "0.54"
spin = "0.10"
network-types = { version = "0.2", default-features = false, features = ["zerocopy"] }
zerocopy = { git = "https://github.com/google/zerocopy", default-features = false, features = ["derive"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }

[patch.crates-io]
# network-types = { path = "../network-types" }
# Or using git:
network-types = { git = "https://github.com/ninegamma/network-types.git", branch = "zerocopy" }

[patch."https://github.com/ninegamma/wabrix_api.git"]
wabrix_api = { path = "../wabrix_api/wabrix_api"}

[package]
name = "wabrix_plugins"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "TCP and generator implementations for Wabrix plugins and native nodes"

[dependencies]
wabrix_api = { workspace = true }
network-types = { workspace = true }
zerocopy = { workspace = true }
hashbrown = { version = "0.17.1", features = ["serde"] }
postcard = { workspace = true }
log = { version = "0.4.29", default-features = false }
