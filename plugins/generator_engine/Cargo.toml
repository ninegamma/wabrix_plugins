[package]
name = "generator_engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# This is crucial for Wasm components
crate-type = ["cdylib"]

[features]
default = []
runtime-diagnostics = []

[dependencies]
# Pull this from your workspace.dependencies
wit-bindgen = { workspace = true }
wabrix_api = { workspace = true }
wabrix_plugins = { workspace = true }
network-types = "0.2.0"
log = { version = "0.4", default-features = false }
